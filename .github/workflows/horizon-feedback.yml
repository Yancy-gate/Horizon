name: Horizon Feedback Sync

on:
  repository_dispatch:
    types: [horizon-feedback]

jobs:
  apply-feedback:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Append feedback entry
        env:
          FEEDBACK_ENTRY: ${{ toJson(github.event.client_payload.entry) }}
        run: |
          uv run python scripts/append_feedback_entry.py

      - name: Apply feedback to profile
        run: uv run horizon-preference-ingest --apply-feedback

      - name: Commit preference updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/preference-radar/feedback.jsonl \
                  data/preference-radar/feedback_state.json \
                  data/preference-radar/profile.json || true
          if git diff --staged --quiet; then
            echo "No preference changes to commit."
          else
            git commit -m "💬 preference feedback: ${{ github.event.client_payload.entry.url }}"
            git push
          fi
