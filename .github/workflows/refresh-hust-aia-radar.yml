name: Refresh HUST AIA Research Radar

on:
  schedule:
    # Re-research public faculty profiles every three calendar months.
    - cron: "0 2 1 1,4,7,10 *"
  workflow_dispatch:

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Refresh faculty research profile
        run: uv run python scripts/refresh_hust_aia_profile.py

      - name: Commit refreshed profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hust_aia_research_profile.json data/config.github.json
          if git diff --staged --quiet; then
            echo "Faculty research profile is unchanged."
          else
            git commit -m "chore: refresh HUST AIA research profile"
            git push
          fi
